name: Build Android APK (React Native)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'expo-android-app/package.json'

      - name: 📱 Set up Android SDK & NDK
        run: |
          echo "Android Home: $ANDROID_HOME"
          # Accept all Android SDK licenses
          yes | sdkmanager --licenses || true
          # Install the specific NDK and build-tools required by React Native / WebRTC
          sdkmanager "ndk;26.1.10909125" "build-tools;35.0.0" "platforms;android-35" "cmake;3.22.1" || true

      - name: 📦 Install Expo App Dependencies
        working-directory: expo-android-app
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ Verify Native Android Code (Expo Prebuild)
        working-directory: expo-android-app
        run: |
          # If android directory doesn't exist, generate it cleanly
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          else
            echo "Native Android project already generated and configured."
          fi

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔨 Build Android APK with Gradle
        working-directory: expo-android-app/android
        run: |
          chmod +x gradlew
          # Build installable universal debug APK with 4GB heap
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 🔍 Locate Generated APK
        id: locate_apk
        run: |
          echo "Listing all generated APK files:"
          find expo-android-app/android/app/build/outputs/apk -type f -name "*.apk" -ls
          
          PRIMARY_APK=$(find expo-android-app/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$PRIMARY_APK" ]; then
            echo "::error::No APK file found in build output!"
            exit 1
          fi
          echo "Found APK: $PRIMARY_APK"
          echo "apk_path=$PRIMARY_APK" >> $GITHUB_OUTPUT

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatPulse-Android-APK
          path: expo-android-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📋 Job Summary
        run: |
          echo "### 🚀 Android APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your installable Android APK is ready." >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`ChatPulse-Android-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: \`com.chatpulse.videochat\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Permissions**: Camera, Microphone, Network" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK directly from the **Summary / Artifacts** section of this GitHub Actions run and install it on your Android phone!" >> $GITHUB_STEP_SUMMARY
