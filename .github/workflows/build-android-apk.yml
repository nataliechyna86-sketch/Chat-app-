name: Build Android APK (React Native)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'expo-android-app/package.json'

      - name: 📦 Install Expo App Dependencies
        working-directory: expo-android-app
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        working-directory: expo-android-app
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: 🐘 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('expo-android-app/android/**/*.gradle*', 'expo-android-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build Android APK with Gradle
        working-directory: expo-android-app/android
        run: |
          chmod +x gradlew
          # Build installable debug APK (compatible with all Android devices without custom keystore)
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔍 Locate Generated APK
        id: locate_apk
        run: |
          echo "Listing all generated APK files:"
          find expo-android-app/android/app/build/outputs/apk -name "*.apk" -ls
          
          PRIMARY_APK=$(find expo-android-app/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$PRIMARY_APK" ]; then
            echo "::error::No APK file found in build output!"
            exit 1
          fi
          echo "Found APK: $PRIMARY_APK"
          echo "apk_path=$PRIMARY_APK" >> $GITHUB_OUTPUT

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatPulse-Android-APK
          path: expo-android-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📋 Job Summary
        run: |
          echo "### 🚀 Android APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your installable Android APK is ready." >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`ChatPulse-Android-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: Universal Android (ARM64 / x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- **Permissions**: Camera, Microphone, Network" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK directly from the **Summary** tab of this GitHub Actions run and install it on your Android phone!" >> $GITHUB_STEP_SUMMARY
